name: Application and FinanceMTEB checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Application unit tests
        run: python -m pytest -q
      - name: FinanceMTEB protocol and sealed result checks
        working-directory: evals/retrieval/finmteb_zh
        env:
          PYTHONPATH: src
        run: python -m pytest -q
