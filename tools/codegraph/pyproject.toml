[project]
name = "codegraph"
version = "0.1.0"
description = "Code-aware GraphRAG: structural knowledge graphs from source code via AST parsing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CodeGraph Contributors" }]

dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "networkx>=3.2",
    "leidenalg>=0.10.0",
    "igraph>=0.11.0",
    "numpy>=1.26.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2.0"]
openai = ["openai>=1.0.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "ruff>=0.1.0"]

[project.scripts]
codegraph = "codegraph.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
